<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category — Momentum Education</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body data-theme="classic">
<header class="top">
<button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
<div class="logo">
<svg width="34" height="24" viewBox="0 0 120 80">
<circle cx="10" cy="62" r="3" fill="var(--accent)"/>
<circle cx="17" cy="52" r="4" fill="var(--accent)"/>
<circle cx="24" cy="42" r="5" fill="var(--accent)"/>
<path d="M30 15 L52 58 L74 15 L96 58 L108 58" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="112" cy="58" r="9" fill="none" stroke="var(--red)" stroke-width="5"/>
</svg>
Momentum Education
</div>
<div class="right">
<a class="btn" href="https://www.youtube.com/@momentum.education?sub_confirmation=1" target="_blank">Subscribe</a>
<button class="btn ghost" id="themeBtn">Dark</button>
</div>
</header>
<div class="shade" id="shade"></div>
<nav class="side" id="side"></nav>
<main id="mainContent"></main>
<footer>
<strong>Our motive</strong><br>
সবার জন্য বিনামূল্যে মানসম্মত শিক্ষা পৌঁছে দেওয়া।
<div class="links">
<a href="contact.html">Contacts</a>
<a href="https://www.youtube.com/@momentum.education" target="_blank">YouTube</a>
<a href="https://www.facebook.com/momentum.edu.official" target="_blank">Facebook</a>
</div>
</footer>
<script src="js/utils.js"></script>
<script src="js/adsterra.js"></script>
<script>
var catSlug=qs('c');
var catName='';
var content=await fetch('data/content.json').then(function(r){return r.json()});
var cat=content[catSlug];
if(!cat){
 document.getElementById('mainContent').innerHTML='<div class="cat-hero"><div class="empty-state"><h2>Category not found</h2><p>The page you are looking for does not exist.</p><p style="margin-top:14px"><a class="btn" href="index.html">Go to Home</a></p></div></div>';
 initPage();
} else {
 catName=cat.title;
 renderCategory(cat);
 initPage();
}
function renderCategory(cat){
 var container=document.getElementById('mainContent');
 var html='<section class="cat-hero"><h1>'+escapeHTML(catName)+'</h1><p>'+escapeHTML(cat.description||'')+'</p></section>';
 var items=cat.items||[];
 if(items.length===0){
 html+='<div class="empty-state"><h2>Coming Soon</h2><p>Content for this category will be added soon!</p></div>';
 } else if(catSlug==='videos'){
 html+='<div class="grid">';
 for(var i=0;i<items.length;i++){var v=items[i];
 html+='<div class="card"><div style="aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000"><iframe src="https://www.youtube.com/embed/'+escapeHTML(v.youtubeId)+'" frameborder="0" allowfullscreen style="width:100%;height:100%" loading="lazy"></iframe></div><h3>'+escapeHTML(v.title)+'</h3><p>'+escapeHTML(v.description||'')+'</p></div>';}
 html+='</div>';
 } else if(catSlug==='books'){
 html+='<div class="grid">';
 for(var i=0;i<items.length;i++){var b=items[i];
 html+='<div class="card"><h3>'+escapeHTML(b.title)+'</h3><p>'+escapeHTML(b.description||'')+'</p><a class="btn" href="'+escapeHTML(b.url)+'" target="_blank">Download</a></div>';}
 html+='</div>';
 } else if(catSlug==='games'){
 html+='<div class="grid">';
 for(var i=0;i<items.length;i++){var g=items[i];
 html+='<div class="card"><h3>'+escapeHTML(g.title)+'</h3><p>'+escapeHTML(g.description||'')+'</p>';
 if(g.url&&g.url!=='#') html+='<a class="btn" href="'+escapeHTML(g.url)+'">Play Now</a>';
 else html+='<span style="color:var(--muted);font-size:13px">Coming Soon</span>';
 html+='</div>';}
 html+='</div>';
 } else if(catSlug==='music'){
 html='';
 for(var i=0;i<items.length;i++){var m=items[i];
 html+='<div class="music-player"><h3>'+escapeHTML(m.title)+'</h3><p>'+escapeHTML(m.description||'')+'</p><audio controls preload="metadata"><source src="'+escapeHTML(m.file)+'" type="audio/mpeg"><p>Your browser does not support audio playback.</p></audio><br><a class="btn" href="'+escapeHTML(m.file)+'" download>Download</a></div>';}
 } else if(catSlug==='tools'){
 html+='<div class="grid">';
 for(var i=0;i<items.length;i++){var t=items[i];
 html+='<div class="card"><h3>'+escapeHTML(t.title)+'</h3><p>'+escapeHTML(t.description||'')+'</p>';
 if(t.url&&t.url!=='#') html+='<a class="btn" href="'+escapeHTML(t.url)+'">Open Tool</a>';
 else html+='<span style="color:var(--muted);font-size:13px">Coming Soon</span>';
 html+='</div>';}
 html+='</div>';
 } else {
 html+='<div class="grid">';
 for(var i=0;i<items.length;i++){var s=items[i];
 html+='<div class="card"><h3>'+escapeHTML(s.title)+'</h3><p>'+escapeHTML(s.description||'')+'</p>';
 if(s.url&&s.url!=='#') html+='<a class="btn" href="'+escapeHTML(s.url)+'">View</a>';
 html+='</div>';}
 html+='</div>';
 }
 container.innerHTML=html;
}
</script>
</body>
</html>
